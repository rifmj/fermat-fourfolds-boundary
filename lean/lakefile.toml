name = "fermat-boundary-lean"
defaultTargets = ["BoundaryCore", "BoundaryData", "BoundaryClaim", "BoundaryValidity",
                  "BoundaryCensus", "BoundaryCensusSweeps1", "BoundaryCensusSweeps2",
                  "BoundaryCensusSweeps3", "BoundaryCensusSweeps4", "BoundaryCensusSweeps5",
                  "BoundaryCensusMain", "BoundaryThmB",
                  "BoundaryForms"]

# Tier-1 (BoundaryCore + BoundaryData) and Tier-2 (BoundaryClaim + BoundaryValidity) are
# standalone Lean-core (no mathlib; also compile with a bare `lean`); BoundaryValidity adds
# no native_decide of its own. Tier-3 (BoundaryForms) needs mathlib.
[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.32.0"

[[lean_lib]]
name = "BoundaryCore"

[[lean_lib]]
name = "BoundaryData"

[[lean_lib]]
name = "BoundaryClaim"

[[lean_lib]]
name = "BoundaryValidity"

[[lean_lib]]
name = "BoundaryForms"

[[lean_lib]]
name = "BoundaryCensus"

[[lean_lib]]
name = "BoundaryCensusSweeps1"

[[lean_lib]]
name = "BoundaryCensusSweeps2"

[[lean_lib]]
name = "BoundaryCensusSweeps3"

[[lean_lib]]
name = "BoundaryCensusSweeps4"

[[lean_lib]]
name = "BoundaryCensusSweeps5"

[[lean_lib]]
name = "BoundaryCensusMain"

[[lean_lib]]
name = "BoundaryThmB"
